services:
  - type: web
    name: campus-connect
    runtime: docker
    plan: starter
    healthCheckPath: /up
    disk:
      name: campus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: CampusConnect
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@campusconnect.test
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
